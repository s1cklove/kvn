name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      SING_BOX_VERSION: "1.14.4"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install sing-box (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL "https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/sing-box-${SING_BOX_VERSION}-linux-amd64.tar.gz" -o sb.tar.gz
          tar -xzf sb.tar.gz
          mkdir -p "$HOME/.local/bin"
          mv "sing-box-${SING_BOX_VERSION}-linux-amd64/sing-box" "$HOME/.local/bin/sing-box"
          chmod +x "$HOME/.local/bin/sing-box"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install sing-box (macOS)
        if: runner.os == 'macOS'
        run: |
          arch=$(uname -m)
          if [ "$arch" = "arm64" ]; then sb_arch="arm64"; else sb_arch="amd64"; fi
          curl -fsSL "https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/sing-box-${SING_BOX_VERSION}-darwin-${sb_arch}.tar.gz" -o sb.tar.gz
          tar -xzf sb.tar.gz
          mkdir -p "$HOME/.local/bin"
          mv "sing-box-${SING_BOX_VERSION}-darwin-${sb_arch}/sing-box" "$HOME/.local/bin/sing-box"
          chmod +x "$HOME/.local/bin/sing-box"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install sing-box (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = $env:SING_BOX_VERSION
          Invoke-WebRequest -Uri "https://github.com/SagerNet/sing-box/releases/download/v$ver/sing-box-$ver-windows-amd64.zip" -OutFile sb.zip
          Expand-Archive -Path sb.zip -DestinationPath sb_out
          $binDir = "$env:RUNNER_TEMP\bin"
          New-Item -ItemType Directory -Force -Path $binDir | Out-Null
          Move-Item "sb_out\sing-box-$ver-windows-amd64\sing-box.exe" "$binDir\sing-box.exe"
          $binDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify sing-box
        run: sing-box version

      - name: Run unit tests (zero external Python deps)
        run: python -m unittest discover -s tests -v

      - name: Syntax-check isolated UI entrypoint
        run: python -m py_compile ui/app.py
