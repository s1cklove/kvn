name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ui:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: kvn-connect-windows-amd64.zip
            sb_asset: windows-amd64.zip
            sb_bin: sing-box.exe
            sep: ";"
          - os: macos-latest
            artifact: kvn-connect-macos-arm64.tar.gz
            sb_asset: darwin-arm64.tar.gz
            sb_bin: sing-box
            sep: ":"
          - os: ubuntu-latest
            artifact: kvn-connect-linux-amd64.tar.gz
            sb_asset: linux-amd64.tar.gz
            sb_bin: sing-box
            sep: ":"

    runs-on: ${{ matrix.os }}
    env:
      SING_BOX_VERSION: "1.14.4"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux WebKit / GTK build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-webkit2-4.1 libgirepository1.0-dev libcairo2-dev

      - name: Install UI & PyInstaller dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ui]" pyinstaller

      - name: Download sing-box binary
        shell: bash
        run: |
          mkdir -p build_bin
          url="https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/sing-box-${SING_BOX_VERSION}-${{ matrix.sb_asset }}"
          if [[ "${{ matrix.sb_asset }}" == *.zip ]]; then
            curl -fsSL "$url" -o sb.zip
            unzip -q sb.zip -d sb_out
          else
            curl -fsSL "$url" -o sb.tar.gz
            mkdir -p sb_out
            tar -xzf sb.tar.gz -C sb_out
          fi
          find sb_out -name "${{ matrix.sb_bin }}" -exec cp {} "build_bin/${{ matrix.sb_bin }}" \;
          chmod +x "build_bin/${{ matrix.sb_bin }}" || true

      - name: Build KVN Connect bundle
        shell: bash
        run: |
          EXTRA_ARGS=()
          ICON_FILE=""
          if [ -f ui/icon.png ]; then
            ICON_FILE="ui/icon.png"
          elif [ -f icon.png ]; then
            ICON_FILE="icon.png"
          fi
          if [ -n "$ICON_FILE" ]; then
            EXTRA_ARGS+=(--add-data "${ICON_FILE}${{ matrix.sep }}.")
            EXTRA_ARGS+=(--icon "$ICON_FILE")
          fi

          if [ "${{ runner.os }}" = "Windows" ]; then
            EXTRA_ARGS+=(--collect-all webview --collect-all clr_loader --collect-all pythonnet)
            EXTRA_ARGS+=(--hidden-import pystray._win32 --hidden-import webview.platforms.edgechromium)
          elif [ "${{ runner.os }}" = "macOS" ]; then
            EXTRA_ARGS+=(--collect-all webview --hidden-import pystray._darwin)
          else
            EXTRA_ARGS+=(--collect-all webview --hidden-import pystray._appindicator --hidden-import pystray._xorg)
          fi

          pyinstaller \
            --noconfirm \
            --clean \
            --windowed \
            --name KVN-Connect \
            --add-data "ui/web${{ matrix.sep }}web" \
            --add-binary "build_bin/${{ matrix.sb_bin }}${{ matrix.sep }}." \
            "${EXTRA_ARGS[@]}" \
            ui/app.py

      - name: Smoke-test bundled executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\KVN-Connect\KVN-Connect.exe")) { throw "KVN-Connect.exe missing" }
          if (-not (Get-ChildItem -Path "dist\KVN-Connect" -Recurse -Filter "sing-box.exe")) { throw "sing-box.exe missing" }
          & "dist\KVN-Connect\KVN-Connect.exe" status --json
          if ($LASTEXITCODE -gt 1) { throw "unexpected exit code: $LASTEXITCODE" }

      - name: Smoke-test bundled executable (Linux)
        if: runner.os == 'Linux'
        run: |
          test -x dist/KVN-Connect/KVN-Connect
          find dist/KVN-Connect -name sing-box | grep -q sing-box
          ./dist/KVN-Connect/KVN-Connect status --json || [ $? -eq 1 ]

      - name: Smoke-test bundled executable (macOS)
        if: runner.os == 'macOS'
        run: |
          test -d dist/KVN-Connect.app
          find dist/KVN-Connect.app -name sing-box | grep -q sing-box
          ./dist/KVN-Connect.app/Contents/MacOS/KVN-Connect status --json || [ $? -eq 1 ]

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist\KVN-Connect\* -DestinationPath "${{ matrix.artifact }}"

      - name: Package archive (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            tar -czf "${{ matrix.artifact }}" -C dist KVN-Connect.app
          else
            tar -czf "${{ matrix.artifact }}" -C dist KVN-Connect
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
